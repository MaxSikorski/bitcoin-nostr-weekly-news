<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title></title>
    <meta name="description" content="">
    <script src="config.js"></script>
    <script>
        // Pre-paint branding from config.js: title, description, favicons.
        (function (cfg) {
            if (!cfg) return;
            var page = /week\.html$/.test(location.pathname) ? 'week' : 'index';
            document.title = cfg.pageTitles[page];
            var meta = document.querySelector('meta[name="description"]');
            if (meta) meta.content = cfg.metaDescription[page];
            (cfg.favicons || []).forEach(function (icon) {
                var link = document.createElement('link');
                Object.keys(icon).forEach(function (k) { link.setAttribute(k, icon[k]); });
                document.head.appendChild(link);
            });
        })(window.SITE_CONFIG);
    </script>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

    <!-- Navigation -->
    <nav class="header-nav">
        <a href="index.html" class="logo" id="logo-refresh"></a>
        <div class="nav-right">
            <span id="nav-links"></span>
            <button id="search-toggle" class="theme-toggle search-toggle" aria-label="Search all presentations" title="Search (/)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
                </svg>
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path class="sun-path"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title"></h1>
            <p class="hero-subtitle"></p>
            <a href="#current-section" class="scroll-cue" aria-label="Scroll to presentations">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M19 12l-7 7-7-7"/>
                </svg>
            </a>
        </div>
    </section>

    <!-- Current Presentation -->
    <div class="content-section current-section" id="current-section">
        <p class="section-label">This Week</p>
        <div id="current-list" class="archive-list current-list"></div>
    </div>

    <!-- Archive List -->
    <div class="content-section" id="presentations">
        <p class="section-label">Past Presentations</p>
        <div id="archive-list" class="archive-list">
            <!-- Populated by JavaScript -->
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <p class="empty-state-text">No presentations yet. Check back soon.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="site-footer"></footer>

    <script src="gsap.min.js"></script>
    <script src="script.js"></script>
    <script src="data.js"></script>
    <script>
        (function () {
            'use strict';

            const archiveList = document.getElementById('archive-list');
            const currentList = document.getElementById('current-list');
            const pastSection = document.getElementById('presentations');
            const emptyState = document.getElementById('empty-state');

            function buildCard(week, index, featured) {
                const card = document.createElement('a');
                card.href = `week.html?week=${week.id}`;
                card.className = featured ? 'archive-card current-card' : 'archive-card';
                card.dataset.delay = index * 0.1;

                const dateObj = new Date(week.date + 'T12:00:00');
                const formattedDate = dateObj.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                card.innerHTML = `
                    <div class="archive-card-info">
                        <p class="archive-card-date">${formattedDate}</p>
                        <h3 class="archive-card-title">${week.title}</h3>
                    </div>
                    <svg class="archive-card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                `;

                // Breathing glow on the featured card — a soft halo swells in and melts
                // away (1s in, 1s out), then 2s fully dark, forever.
                const haloColors = (window.SITE_CONFIG && window.SITE_CONFIG.halo) || [];
                if (featured && haloColors.length > 0) {
                    const halo = document.createElement('div');
                    halo.className = 'glow-halo';
                    halo.setAttribute('aria-hidden', 'true');
                    card.appendChild(halo);

                    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    if (!reduceMotion && typeof gsap !== 'undefined') {
                        const tl = gsap.timeline({ repeat: -1 });
                        const addPulse = (color) => {
                            tl.set(halo, { boxShadow: `0 0 14px 2px ${color}, 0 0 42px 12px ${color}` });
                            tl.to(halo, { opacity: 1, duration: 1, ease: 'sine.inOut' });
                            tl.to(halo, { opacity: 0, duration: 1, ease: 'sine.inOut' });
                            tl.to({}, { duration: 2 });
                        };
                        haloColors.forEach(color => addPulse(color));
                    }
                }
                return card;
            }

            function renderArchive(data) {
                if (!data.weeks || data.weeks.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                // Sort weeks newest first
                const sorted = data.weeks.slice().sort((a, b) => b.date.localeCompare(a.date));

                // Newest week is featured up top as "This Week"
                currentList.appendChild(buildCard(sorted[0], 0, true));

                // Everything else goes under "Past Presentations"
                const past = sorted.slice(1);
                if (past.length === 0) {
                    pastSection.style.display = 'none';
                } else {
                    const monthGroups = new Map();
                    past.forEach(week => {
                        const dateObj = new Date(week.date + 'T12:00:00');
                        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                        if (!monthGroups.has(monthKey)) {
                            monthGroups.set(monthKey, { date: dateObj, weeks: [] });
                        }
                        monthGroups.get(monthKey).weeks.push(week);
                    });

                    const months = Array.from(monthGroups.entries()).sort(([a], [b]) => b.localeCompare(a));
                    const openMonths = (window.SITE_CONFIG && window.SITE_CONFIG.archive && window.SITE_CONFIG.archive.openMonths) ?? 2;
                    const archiveYears = new Map();

                    months.forEach(([monthKey]) => {
                        const year = monthKey.slice(0, 4);
                        if (!archiveYears.has(year)) archiveYears.set(year, monthKey);
                    });

                    if (archiveYears.size > 1) {
                        const yearRail = document.createElement('nav');
                        yearRail.className = 'archive-years';
                        yearRail.setAttribute('aria-label', 'Jump to year');
                        archiveYears.forEach((monthKey, year) => {
                            const yearLink = document.createElement('a');
                            yearLink.href = `#month-${monthKey}`;
                            yearLink.textContent = year;
                            yearRail.appendChild(yearLink);
                        });
                        archiveList.prepend(yearRail);
                    }

                    months.forEach(([monthKey, month], monthIndex) => {
                        const isOpen = monthIndex < openMonths;
                        const monthSection = document.createElement('section');
                        monthSection.className = 'archive-month';
                        monthSection.dataset.month = monthKey;

                        const monthToggle = document.createElement('button');
                        monthToggle.type = 'button';
                        monthToggle.className = 'archive-month-toggle';
                        monthToggle.setAttribute('aria-expanded', String(isOpen));
                        monthToggle.setAttribute('aria-controls', `month-${monthKey}`);

                        const monthName = document.createElement('span');
                        monthName.className = 'archive-month-name';
                        monthName.textContent = month.date.toLocaleDateString('en-US', {
                            month: 'long',
                            year: 'numeric'
                        });

                        const monthCount = document.createElement('span');
                        monthCount.className = 'archive-month-count';
                        monthCount.textContent = `${month.weeks.length} ${month.weeks.length === 1 ? 'deck' : 'decks'}`;

                        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        chevron.setAttribute('class', 'archive-month-chevron');
                        chevron.setAttribute('width', '16');
                        chevron.setAttribute('height', '16');
                        chevron.setAttribute('viewBox', '0 0 24 24');
                        chevron.setAttribute('fill', 'none');
                        chevron.setAttribute('stroke', 'currentColor');
                        chevron.setAttribute('stroke-width', '1.5');
                        chevron.setAttribute('stroke-linecap', 'round');
                        chevron.setAttribute('stroke-linejoin', 'round');
                        chevron.setAttribute('aria-hidden', 'true');
                        const chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        chevronPath.setAttribute('d', 'M6 9l6 6 6-6');
                        chevron.appendChild(chevronPath);

                        const monthCards = document.createElement('div');
                        monthCards.className = 'archive-month-cards';
                        monthCards.id = `month-${monthKey}`;
                        monthCards.hidden = !isOpen;
                        month.weeks.forEach((week, i) => monthCards.appendChild(buildCard(week, i, false)));

                        monthToggle.appendChild(monthName);
                        monthToggle.appendChild(monthCount);
                        monthToggle.appendChild(chevron);
                        monthSection.appendChild(monthToggle);
                        monthSection.appendChild(monthCards);
                        archiveList.appendChild(monthSection);

                        monthToggle.addEventListener('click', () => {
                            const expanded = monthToggle.getAttribute('aria-expanded') === 'true';
                            monthToggle.setAttribute('aria-expanded', String(!expanded));
                            monthCards.hidden = expanded;

                            if (!expanded && typeof gsap !== 'undefined') {
                                monthCards.querySelectorAll('.archive-card').forEach(card => {
                                    gsap.to(card, {
                                        opacity: 1,
                                        y: 0,
                                        duration: 0.8,
                                        ease: 'power4.out',
                                        delay: parseFloat(card.dataset.delay) || 0
                                    });
                                });
                            }
                        });
                    });
                }

                // Trigger scroll reveals for dynamically added cards
                if (typeof gsap !== 'undefined') {
                    const cards = document.querySelectorAll('.archive-card');
                    gsap.set(cards, { opacity: 0, y: 20 });

                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                gsap.to(entry.target, {
                                    opacity: 1,
                                    y: 0,
                                    duration: 0.8,
                                    ease: 'power4.out',
                                    delay: parseFloat(entry.target.dataset.delay) || 0
                                });
                                observer.unobserve(entry.target);
                            }
                        });
                    }, { threshold: 0.1 });

                    cards.forEach(card => observer.observe(card));
                }
            }

            // Try fetch first (works on GitHub Pages / HTTP), fall back to inline data (file://)
            fetch('weeks/index.json')
                .then(res => {
                    if (!res.ok) throw new Error('HTTP error');
                    return res.json();
                })
                .then(data => {
                    renderArchive(data);
                    const initialQuery = new URLSearchParams(window.location.search).get('q') || '';
                    if (initialQuery) window.DeckSearch.openPalette({ initialQuery });
                })
                .catch(() => {
                    console.log('Using inline data (file:// mode)');
                    renderArchive(window.INLINE_DATA || { weeks: [] });
                    const initialQuery = new URLSearchParams(window.location.search).get('q') || '';
                    if (initialQuery) window.DeckSearch.openPalette({ initialQuery });
                });
        })();
    </script>
</body>
</html>
